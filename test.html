<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Widget Test Page</title>
  <style>
    body {
      max-width: 700px;
      margin: 40px auto;
      font-family: sans-serif;
      background: #e9e9e9;
      padding: 20px;
    }
    article {
      background: #ffffff;
      padding: 20px;
      border: 1px solid #ccc;
      margin-bottom: 24px;
    }
  </style>
</head>
<body>
  <article>
    <h1>Sample Blog Post</h1>
    <p>This simulates a static post page embedding the Haro comment widget.</p>
  </article>

  <section>
    <h3>Comments</h3>
    <iframe
      src="http://localhost:3000/api/comments?site=jakob&post=sample-post"
      width="100%"
      height="500"
      style="border: 1px solid #ccc; background: #ffffff;"
    ></iframe>
  </section>
</body>
</html>
